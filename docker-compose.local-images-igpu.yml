# Local pictures on integrated graphics (AMD Radeon / Intel) via Vulkan, on
# Linux. Use it together with the local-images file:
#   docker compose -f docker-compose.yml -f docker-compose.local-images.yml \
#     -f docker-compose.local-images-igpu.yml up -d --build
# Like docker-compose.igpu.yml, the container brings its own Mesa drivers and
# only needs the GPU device: ls /dev/dri/renderD*
# Not yet tested on real hardware; please report how it goes.
services:
  sd-model:
    build:
      args: { SD_GPU: vulkan }

  sd:
    build:
      args: { SD_GPU: vulkan }
    devices: ["/dev/dri"]
