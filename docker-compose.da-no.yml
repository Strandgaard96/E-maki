# Danish and Norwegian speech models next to stock Whisper, for a house that
# mixes the two with English. Add this file to the docker compose command:
#   docker compose -f docker-compose.yml -f docker-compose.da-no.yml up -d --build
# Stock Whisper still detects the language and handles English. A Danish
# segment is then transcribed again by Edda, a Norwegian one by NB-Whisper.
# Tick the languages spoken under E-maki > Listening on the settings page.
#
# Models, set in .env:
#   WHISPER_DA_MODEL_URL  a ggml build of Edda v0.2 (required, see below)
#   WHISPER_NO_MODEL_URL  defaults to NB-Whisper medium q5_0 (539 MB) from
#                         the National Library of Norway
#   WHISPER_DA_MODEL, WHISPER_NO_MODEL  the file names they are kept under;
#                         give a new name when you change a URL
# Edda's makers publish no ggml file, so pick a community conversion you
# trust (the file is parsed by whisper.cpp), and pin it with
# WHISPER_DA_MODEL_SHA256.
#
# Each model stays loaded: about 1 GB of RAM for Edda (q8_0) and 0.6 GB for
# NB-Whisper medium (q5_0), on top of stock Whisper. These two servers run on
# the CPU, also with an igpu file.
#
# Like whisper, they sit on "local", with no route to the internet; their
# models come from the one-shot *-model services.

x-whisper-extra: &whisper-extra
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  build: { context: ., dockerfile: docker/whisper.Dockerfile }

x-whisper-health: &whisper-health
  test: ["CMD", "curl", "-fs", "http://localhost:8081/"]
  interval: 10s
  retries: 120
  start_period: 30s

services:
  whisper-da-model:
    <<: *whisper-extra
    command: ["download"]
    environment:
      WHISPER_MODEL: ${WHISPER_DA_MODEL:-edda-v0.2}
      WHISPER_MODEL_URL: ${WHISPER_DA_MODEL_URL:?set WHISPER_DA_MODEL_URL in .env to a ggml build of Edda v0.2, see docker-compose.da-no.yml}
      WHISPER_MODEL_SHA256: ${WHISPER_DA_MODEL_SHA256:-}
    volumes: [whisper-models:/models]
    restart: on-failure

  whisper-da:
    <<: *whisper-extra
    depends_on:
      whisper-da-model: { condition: service_completed_successfully }
    environment:
      WHISPER_MODEL: ${WHISPER_DA_MODEL:-edda-v0.2}
      WHISPER_THREADS: ${WHISPER_THREADS:-}
    volumes: [whisper-models:/models:ro]
    networks: [local]
    restart: unless-stopped
    healthcheck: *whisper-health

  whisper-no-model:
    <<: *whisper-extra
    command: ["download"]
    environment:
      WHISPER_MODEL: ${WHISPER_NO_MODEL:-nb-whisper-medium-q5_0}
      WHISPER_MODEL_URL: ${WHISPER_NO_MODEL_URL:-https://huggingface.co/NbAiLab/nb-whisper-medium/resolve/main/ggml-model-q5_0.bin}
      WHISPER_MODEL_SHA256: ${WHISPER_NO_MODEL_SHA256:-}
    volumes: [whisper-models:/models]
    restart: on-failure

  whisper-no:
    <<: *whisper-extra
    depends_on:
      whisper-no-model: { condition: service_completed_successfully }
    environment:
      WHISPER_MODEL: ${WHISPER_NO_MODEL:-nb-whisper-medium-q5_0}
      WHISPER_THREADS: ${WHISPER_THREADS:-}
    volumes: [whisper-models:/models:ro]
    networks: [local]
    restart: unless-stopped
    healthcheck: *whisper-health

  emaki:
    depends_on:
      whisper-da: { condition: service_healthy }
      whisper-no: { condition: service_healthy }
    environment:
      WHISPER_URL_DA: http://whisper-da:8081
      WHISPER_URL_NO: http://whisper-no:8081
