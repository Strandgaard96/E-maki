# PRs are squash-merged, so the PR title becomes the commit on main, and
# release-please reads it to pick the next version and write the CHANGELOG.
# It must be a conventional commit: feat: ..., fix(ui): ..., feat!: ...
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style'
          if printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: .+"; then
            exit 0
          fi
          echo "::error::PR title must be a conventional commit, like \"feat: add X\" or \"fix(ui): Y\". Types: ${types//|/, }."
          exit 1
