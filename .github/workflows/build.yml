# Builds and publishes the E-maki image, ghcr.io/strandgaard96/emaki.
#
# Only the release PR builds the image, and only when you ask: put the
# "build" label on it. The label comes off again once it has built.
#   1. release-please keeps a release PR open on main (next version and
#      CHANGELOG, from the conventional commit titles).
#   2. Labelled "build", that PR builds the image for amd64 and arm64 from its
#      merge result and pushes it as :tree-<git tree hash>. Its "build" check
#      fails until an image of its current content exists, so it can't merge
#      unbuilt; a new commit on it needs the label again.
#   3. Merging it cuts the release, and the same image is tagged :X.Y.Z, :X.Y
#      and :latest. Nothing is built twice: the squash commit has the same
#      tree, because main requires the PR to be up to date.
# The whisper and imagegen (sd.Dockerfile) images are built on the user's
# machine, not published; run this workflow by hand to test-build them.
# The "build" job sums up and is the required check, so it always reports.
name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # By hand from the Actions tab. With a release tag (v0.1.0) it publishes
  # that release's image, building it only if it is missing; empty builds
  # all images as a test.
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish the image for, like v0.1.0
        required: false

permissions:
  contents: read

concurrency:
  # PRs by number: a label event on a merged PR has main as its ref, and must
  # not cancel the release run on main.
  group: build-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/strandgaard96/emaki

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # A PR opened with the default token starts no CI, so the release PR
      # could never pass its checks. See docs/releases.md for the token.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # What to build: the image on the release PR (or for a release whose image
  # is missing), the sidecars when their files change.
  plan:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # is the release PR's image there?
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      emaki: ${{ steps.emaki.outputs.build }}
      version: ${{ steps.emaki.outputs.version }}
      sidecars: ${{ github.event_name == 'workflow_dispatch' && !inputs.release && '["whisper","sd"]' || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release }}
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - if: needs.release.outputs.created == 'true' || startsWith(github.head_ref, 'release-please--') || inputs.release
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: emaki
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.head_ref }}
          LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build') }}
          CREATED: ${{ needs.release.outputs.created }}
          RELEASED: ${{ needs.release.outputs.version }}
          INPUT: ${{ inputs.release }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          has_image() { docker buildx imagetools inspect "$IMAGE:tree-$TREE" >/dev/null 2>&1; }
          case "$EVENT" in
            pull_request)
              # Only the release PR builds, and only with the build label.
              if [[ "$HEAD" != release-please--* ]]; then :
              elif [ "$LABEL" = true ]; then build="push"
              elif ! has_image; then
                echo "::error::The release image isn't built for this commit yet. Add the build label to this PR to build it."
                exit 1
              fi ;;
            push) [ "$CREATED" = true ] && version="$RELEASED" ;;
            workflow_dispatch)
              if [ -n "$INPUT" ]; then version="${INPUT#v}"; else build="push"; fi ;;
          esac
          if [ -n "${version:-}" ] && ! has_image; then
            echo "::warning::No image for this release from the release PR, building it now."
            build="push"
          fi
          echo "build=${build:-}" >> "$GITHUB_OUTPUT"
          echo "version=${version:-}" >> "$GITHUB_OUTPUT"

  emaki:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.emaki != '' }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    name: emaki ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ needs.plan.outputs.emaki == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only; the tag job gives both architectures one tag.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/emaki.Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=emaki-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=emaki-${{ matrix.arch }}
      - if: env.PUSH == 'true'
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  # One multi-arch tag for the tree, and the version tags on a release.
  tag:
    needs: [release, plan, emaki]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.plan.outputs.emaki == 'push' || needs.plan.outputs.version != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      TREE: ${{ needs.plan.outputs.tree }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - if: needs.plan.outputs.emaki == 'push'
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.plan.outputs.emaki == 'push'
        run: |
          refs=()
          for d in digests/*; do refs+=("$IMAGE@sha256:${d#digests/}"); done
          docker buildx imagetools create -t "$IMAGE:tree-$TREE" "${refs[@]}"
      - if: env.VERSION != ''
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" "$IMAGE:tree-$TREE"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  # The label is a one-off request: take it off once the build passed.
  unlabel:
    needs: [emaki, tag]
    if: ${{ !cancelled() && needs.emaki.result == 'success' && needs.tag.result != 'failure' && contains(github.event.pull_request.labels.*.name, 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label build
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  sidecars:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.sidecars != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.sidecars) }}
        gpu: ["", vulkan]
    name: ${{ matrix.image }} ${{ matrix.gpu || 'cpu' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          build-args: ${{ matrix.image == 'whisper' && 'WHISPER_GPU' || 'SD_GPU' }}=${{ matrix.gpu }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.gpu || 'cpu' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.gpu || 'cpu' }}

  # The required check. Passes when everything above passed or was skipped
  # because it wasn't needed.
  build:
    needs: [release, plan, emaki, tag, sidecars]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
