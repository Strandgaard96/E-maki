name: CI

# Docs-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The race detector makes the image tests about ten times slower, so
      # pull requests run the plain tests and main runs them with -race.
      - run: go test ${{ github.event_name == 'push' && '-race' || '' }} ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Same version as .pre-commit-config.yaml.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/web/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: internal/web/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: built page is committed
        run: git diff --exit-code -- ../static || { echo "Run npm run build in internal/web/ui and commit the result."; exit 1; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.igpu.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.igpu-wsl.yml config --quiet
      - run: sh -n docker/whisper-entrypoint.sh
      - run: docker build -f docker/ekiru.Dockerfile .
