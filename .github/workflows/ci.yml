name: CI

# lint runs on every change. The other jobs run only when their files
# change; a skipped job counts as passed for required checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's files

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go: ['**/*.go', go.mod, go.sum, 'internal/**', 'testdata/**', 'configs/**', .github/workflows/ci.yml]
            ui: ['internal/web/ui/**', 'internal/web/static/**', .github/workflows/ci.yml]
            docker: ['docker/**', docker-compose.yml, .env.example, go.mod, 'configs/**', .github/workflows/ci.yml]

  # Everything in .pre-commit-config.yaml (formatters, linters, secret scan of
  # the files), plus a gitleaks scan of the full history.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/golangci-lint
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'go.sum') }}
          restore-keys: pre-commit-
      - run: pip install pre-commit
      # The UI typecheck needs node_modules, so it runs in the ui job instead.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ui-typecheck
      - name: gitleaks (history)
        run: |
          v=8.30.1 # same version as .pre-commit-config.yaml
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector makes the image tests about ten times slower, so
      # pull requests run the plain tests and main runs them with -race.
      - run: go test ${{ github.event_name == 'push' && '-race' || '' }} ./...
      - name: govulncheck
        if: github.event_name == 'push'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/web/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: internal/web/ui/package-lock.json
      - run: npm ci
      - run: npx tsc
      - run: npm run build
      - name: built page is committed
        run: git diff --exit-code -- ../static || { echo "Run npm run build in internal/web/ui and commit the result."; exit 1; }
      # Click through every tab and section of the real page (offline, with
      # the synthetic script) and fail on a script error or an empty section.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: every tab and section opens
        run: |
          go build -o /tmp/emaki ../../../cmd/emaki
          (cd ../../.. && PANEL_OPEN=1 /tmp/emaki -script testdata/party.txt > /tmp/emaki.log 2>&1 &)
          for _ in $(seq 30); do curl -sf http://localhost:8090/ >/dev/null && break; sleep 1; done
          node smoke.mjs http://localhost:8090/ || { cat /tmp/emaki.log; exit 1; }

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: GPU=vulkan docker compose config --quiet
      - run: GPU=vulkan-wsl docker compose config --quiet
      - run: LOCAL_IMAGES=1 WHISPER_DA_NO=1 WHISPER_DA_MODEL_URL=https://example.invalid/edda.bin docker compose config --quiet
      - run: GPU=vulkan-wsl LOCAL_IMAGES=1 docker compose config --quiet
      - run: docker build -f docker/emaki.Dockerfile .
