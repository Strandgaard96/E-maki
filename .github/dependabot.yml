version: 2
# Conventional commit titles, which the PR title check and release-please want.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build(deps)" }
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /internal/web/ui
    schedule:
      interval: weekly
    commit-message: { prefix: "build(deps)" }
    groups:
      ui:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build(deps)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/docker"]
    schedule:
      interval: weekly
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build(deps)" }
