# E-maki with whisper-server (speech-to-text) and Ollama (topic LLM),
# listening on this machine's microphone. Four containers at most:
#   emaki     the app and its page
#   whisper   speech to text
#   ollama    topics (left out with TOPIC_MODEL=external)
#   imagegen  pictures made on this machine (only with LOCAL_IMAGES=1)
#   cp .env.example .env && docker compose up -d --build
# then open http://localhost:8090/frame.png (reload to see new topics).
# Written for Linux. On Windows (WSL) set PULSE_SOCKET in .env, see
# docs/wsl.md.
# On the first start each container downloads its own model into a volume
# (the topic LLM, qwen3.5:4b by default, is ~3.4 GB) and keeps it.
#
# Everything else is switched on in .env, not with extra compose files:
#   GPU=vulkan or vulkan-wsl      integrated graphics
#   LOCAL_IMAGES=1                pictures made on this machine (imagegen)
#   WHISPER_DA_NO=1               Danish and Norwegian models, inside whisper
#   TOPIC_MODEL=external          no Ollama, for an external topic model only
#   NET_MIC_BIND=0.0.0.0          a microphone elsewhere on the network
# The services pull in what each option adds from docker/options.yml.

# Fixed project name, so volumes are emaki_* whatever the folder is called.
name: emaki

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# The GPU device and drivers for GPU=..., see docker/options.yml.
x-gpu: &gpu
  file: docker/options.yml
  service: ${GPU:-cpu}

services:
  whisper:
    <<: *hardening
    extends: *gpu
    image: emaki-whisper
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
      args: { WHISPER_GPU: "${GPU:+vulkan}" }
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MODEL_URL: ${WHISPER_MODEL_URL:-}
      WHISPER_MODEL_SHA256: ${WHISPER_MODEL_SHA256:-}
      WHISPER_THREADS: ${WHISPER_THREADS:-}
      # Danish and Norwegian models next to stock Whisper. Stock Whisper still
      # detects the language and handles English; a Danish segment is
      # transcribed again by Edda (port 8082), a Norwegian one by NB-Whisper
      # (8083). Edda's makers publish no ggml file, so WHISPER_DA_MODEL_URL
      # must point to a conversion you trust (pin it with
      # WHISPER_DA_MODEL_SHA256). Together about 1.6 GB of RAM more.
      WHISPER_DA_NO: ${WHISPER_DA_NO:-}
      WHISPER_DA_MODEL: ${WHISPER_DA_MODEL:-}
      WHISPER_DA_MODEL_URL: ${WHISPER_DA_MODEL_URL:-}
      WHISPER_DA_MODEL_SHA256: ${WHISPER_DA_MODEL_SHA256:-}
      WHISPER_NO_MODEL: ${WHISPER_NO_MODEL:-}
      WHISPER_NO_MODEL_URL: ${WHISPER_NO_MODEL_URL:-}
      WHISPER_NO_MODEL_SHA256: ${WHISPER_NO_MODEL_SHA256:-}
    volumes: [whisper-models:/models]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8081/ && { [ -z \"$$WHISPER_DA_NO\" ] || { curl -fs localhost:8082/ && curl -fs localhost:8083/; }; }"]
      interval: 10s
      retries: 120
      start_period: 30s

  # Ollama downloads the model on the first start and keeps it. A model
  # already in the volume is not fetched again ("ollama pull" would whenever
  # its tag is re-uploaded); LLM_MODEL_UPDATE=1 in .env pulls the newest
  # upload anyway.
  ollama:
    <<: *hardening
    extends: { file: docker/options.yml, service: "topics-${TOPIC_MODEL:-local}" }
    image: ollama/ollama:0.40.15
    # Turn off Ollama's cloud models. Keep the LLM loaded; otherwise it
    # unloads after 5 idle minutes and every topic call waits ~10 s to load
    # it again.
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_KEEP_ALIVE: "-1"
      LLM_MODEL: "${LLM_MODEL:-qwen3.5:4b}"
      LLM_MODEL_UPDATE: "${LLM_MODEL_UPDATE:-}"
    entrypoint:
      - sh
      - -c
      - |
        ollama serve & pid=$$!
        trap 'kill $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        if [ -n "$$LLM_MODEL_UPDATE" ] || ! ollama show "$$LLM_MODEL" >/dev/null 2>&1; then
          ollama pull "$$LLM_MODEL"
        fi
        wait $$pid
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

  # Pictures made on this machine with stable-diffusion.cpp (LOCAL_IMAGES=1),
  # so nothing at all leaves the house. The first start downloads FLUX.2
  # klein 4B (about 5.3 GB). It wants about 8 GB of free RAM on top of
  # whisper and Ollama, and a CPU takes minutes per picture. See
  # docs/local-images.md.
  imagegen:
    <<: *hardening
    extends: { file: docker/options.yml, service: "optional-gpu${LOCAL_IMAGES:+-on}" }
    image: emaki-imagegen
    build:
      context: .
      dockerfile: docker/sd.Dockerfile
      args: { SD_GPU: "${GPU:+vulkan}" }
    environment:
      SD_MODEL_URL: ${SD_MODEL_URL:-}
      SD_TEXT_ENCODER_URL: ${SD_TEXT_ENCODER_URL:-}
      SD_VAE_URL: ${SD_VAE_URL:-}
      SD_STEPS: ${SD_STEPS:-}
      SD_THREADS: ${SD_THREADS:-}
      SD_ARGS: ${SD_ARGS:-}
    # The volume keeps its old name, so a model already downloaded is kept.
    volumes: [sd-models:/models]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:1234/v1/models"]
      interval: 10s
      retries: 60
      start_period: 60s

  emaki:
    <<: *hardening
    image: emaki
    build: { context: ., dockerfile: docker/emaki.Dockerfile }
    # No depends_on: the settings page is up while the models download, and
    # System status shows each one as not answering until it does.
    # Runs as your own user, so PulseAudio/PipeWire accepts it. Set
    # EMAKI_UID/EMAKI_GID in .env if `id -u` is not 1000.
    user: "${EMAKI_UID:-1000}:${EMAKI_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    # The page is E-maki's screen, so it is reachable from your local
    # network. It shows what the room talked about: set PANEL_TOKEN in .env
    # to keep other devices out, or PANEL_BIND=127.0.0.1 for this machine
    # only. Never forward port 8090 to the internet.
    # The network microphone port (docs/network-mic.md) is published on
    # NET_MIC_BIND. Left empty, it is only on 127.0.0.1 and E-maki does not
    # listen on it. Audio crosses your network unencrypted: set PANEL_TOKEN
    # so only senders that know it are heard.
    ports:
      - "${PANEL_BIND:-0.0.0.0}:8090:8090"
      - "${NET_MIC_BIND:-127.0.0.1}:${NET_MIC_PORT:-10700}:10700"
    # The API keys and PANEL_TOKEN come straight from .env (git-ignored),
    # so a stale value exported in the shell cannot override them.
    env_file: [{ path: .env, required: false }]
    environment:
      HOME: /tmp
      PULSE_SERVER: "unix:/pulse/native"
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      # Unset is "none" (Qwen answers without thinking); set but empty sends none.
      LLM_REASONING: ${LLM_REASONING-none}
      # Quiet hours and the times on the frame use this; containers run in UTC otherwise.
      TZ: ${TZ:-UTC}
      # Only set when the matching option in .env is on.
      NET_MIC_LISTEN: ${NET_MIC_BIND:+:10700}
      TOPIC_MODEL: ${TOPIC_MODEL:-local}
      WHISPER_URL_DA: ${WHISPER_DA_NO:+http://whisper:8082}
      WHISPER_URL_NO: ${WHISPER_DA_NO:+http://whisper:8083}
      LOCAL_IMAGE_URL: ${LOCAL_IMAGES:+http://imagegen:1234}
      LOCAL_IMAGE_MODEL: ${LOCAL_IMAGE_MODEL:-FLUX.2 klein 4B}
      LOCAL_IMAGE_SIZE: ${LOCAL_IMAGE_SIZE:-}
    # configs/docker.json holds how these containers are wired; you don't
    # need to touch it. /data keeps what the settings page changes (no
    # topics, no transcripts).
    command: ["-config", "/configs/docker.json", "-settings", "/data/settings.json", "-mic"]
    volumes:
      - ./configs:/configs:ro
      - emaki-data:/data
      # The microphone: only the PulseAudio/PipeWire socket, nothing else
      # from the desktop session. If the audio server restarts, restart
      # emaki too (the mounted socket goes stale).
      - type: bind
        source: ${PULSE_SOCKET:-${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native}
        target: /pulse/native
        bind: { create_host_path: false }
    restart: unless-stopped

volumes:
  whisper-models:
  ollama:
  emaki-data:
  sd-models:
