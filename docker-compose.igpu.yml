# Integrated graphics (AMD Radeon / Intel) for whisper via Vulkan, on Linux:
#   docker compose -f docker-compose.yml -f docker-compose.igpu.yml up -d --build
# The container brings its own Mesa Vulkan drivers and only needs the GPU
# device from the host. Check it is there: ls /dev/dri/renderD*
# On Windows (WSL) use docker-compose.igpu-wsl.yml instead.
# Not yet tested on a Linux machine; please report how it goes.
services:
  # Same build as whisper (it only downloads the model).
  whisper-model:
    build:
      args: { WHISPER_GPU: vulkan }

  whisper:
    build:
      args: { WHISPER_GPU: vulkan }
    devices: ["/dev/dri"]
